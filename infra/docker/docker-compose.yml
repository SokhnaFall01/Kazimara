# Environnement de développement local : PostgreSQL, Redis, stockage objet S3-compatible.
name: kazimara-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kazimara
      POSTGRES_USER: kazimara
      POSTGRES_PASSWORD: kazimara
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kazimara"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kazimara
      MINIO_ROOT_PASSWORD: kazimara-dev
    ports: ["9000:9000", "9001:9001"]
    volumes: [s3data:/data]

volumes:
  pgdata:
  s3data:
